# Render free web service + Supabase Storage (temporary home; the disk is wiped on every restart,
# so the database and files are saved to Supabase and come back on start). See README → "Free hosting".
services:
  - type: web
    name: socialmoghq
    runtime: node
    plan: free
    region: singapore
    branch: claude/serene-wright-w0ubi0
    buildCommand: npm ci --include=dev && npm run build
    # node directly (not npm start) so the stop signal reaches the app and it saves before shutting down.
    startCommand: node --no-warnings=ExperimentalWarning src/server/index.ts
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: SEED_DEMO
        value: "0"
      - key: APP_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FOUNDER_EMAIL
        sync: false
      - key: FOUNDER_PASSWORD
        sync: false
